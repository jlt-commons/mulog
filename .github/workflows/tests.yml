name: tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install jolt runtime deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y liblz4-1 zlib1g libtinfo6
      - id: jolt
        uses: jlt-commons/setup-jolt@v1.0.2
      - uses: actions/cache@v4
        with:
          path: |
            ~/.jolt/gitlibs
            ~/.jolt/mvnlibs
            ~/.m2/repository
          key: ${{ runner.os }}-jolt-${{ steps.jolt.outputs.version }}-${{ hashFiles('deps.edn') }}
      - name: Test
        run: JOLT_PWD="$PWD" jolt -M:test
